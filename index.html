<!DOCTYPE html>
<html>
<head>
  <meta name="color-scheme" content="light dark">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    img { max-width: 100%; }
  </style>
</head>
<body>
  <img src="burger_soccer.png" alt="Burger soccer">
  <audio id="a" src="loop.m4a" loop autoplay></audio>
  <script>
    const a = document.getElementById("a");
    a.volume = 0.3;
    a.play().catch(() => document.addEventListener("click", () => a.play(), { once: true }));
  </script>
</body>
</html>
